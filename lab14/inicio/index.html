<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recorrido inmersivo · Laboratorio semana 14</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script>
    /* ============================================================
       Componentes YA HECHOS (no necesita modificarlos)
       ============================================================ */

    // texto-canvas: dibuja un título y un texto sobre un plano usando la API Canvas de HTML5.
    // Admite tildes y ñ porque usa las fuentes del navegador.
    AFRAME.registerComponent('texto-canvas', {
      schema: {
        titulo:  { type: 'string', default: '' },
        texto:   { type: 'string', default: '' },
        ancho:   { type: 'number', default: 1.6 },   // metros
        alto:    { type: 'number', default: 0.9 },   // metros
        fondo:   { type: 'color',  default: '#1B2A41' },
        color:   { type: 'color',  default: '#FFFFFF' },
        alinear: { type: 'string', default: 'left' }, // left | center
        tamano:  { type: 'number', default: 56 }      // tamaño del título en px
      },
      init: function () {
        this.canvas = document.createElement('canvas');
        this.textura = new THREE.CanvasTexture(this.canvas);
        this.textura.colorSpace = THREE.SRGBColorSpace;
        this.material = new THREE.MeshBasicMaterial({ map: this.textura, transparent: true, side: THREE.DoubleSide });
        this.malla = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), this.material);
        this.el.setObject3D('mesh', this.malla);
      },
      update: function () {
        const d = this.data;
        const PX = 1024 / Math.max(d.ancho, d.alto); // resolución: lado mayor = 1024 px
        const w = Math.round(d.ancho * PX), h = Math.round(d.alto * PX);
        this.canvas.width = w; this.canvas.height = h;
        const ctx = this.canvas.getContext('2d');
        const pad = Math.min(w, h) * 0.08;

        // Fondo con esquinas redondeadas
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = d.fondo;
        ctx.beginPath();
        ctx.roundRect(0, 0, w, h, Math.min(w, h) * 0.12);
        ctx.fill();

        // Partir el texto en líneas que quepan en el ancho
        const partir = (texto, fuente) => {
          ctx.font = fuente;
          const lineas = []; let linea = '';
          texto.split(' ').forEach(palabra => {
            const prueba = linea ? linea + ' ' + palabra : palabra;
            if (ctx.measureText(prueba).width > w - 2 * pad && linea) { lineas.push(linea); linea = palabra; }
            else linea = prueba;
          });
          if (linea) lineas.push(linea);
          return lineas;
        };
        const fTitulo = 'bold ' + d.tamano + 'px system-ui, Arial, sans-serif';
        const tTexto = Math.round(d.tamano * 0.62);
        const fTexto = tTexto + 'px system-ui, Arial, sans-serif';
        const bloques = [];
        if (d.titulo) partir(d.titulo, fTitulo).forEach(l => bloques.push({ l, f: fTitulo, a: d.tamano * 1.25 }));
        if (d.texto) partir(d.texto, fTexto).forEach(l => bloques.push({ l, f: fTexto, a: tTexto * 1.4 }));
        const total = bloques.reduce((s, b) => s + b.a, 0);

        let y = d.alinear === 'center' ? (h - total) / 2 : pad;
        ctx.fillStyle = d.color;
        ctx.textBaseline = 'top';
        ctx.textAlign = d.alinear === 'center' ? 'center' : 'left';
        const x = d.alinear === 'center' ? w / 2 : pad;
        bloques.forEach((b, i) => {
          ctx.font = b.f;
          ctx.fillText(b.l, x, y);
          y += b.a + (d.titulo && d.texto && b.f === fTitulo && bloques[i + 1] && bloques[i + 1].f !== fTitulo ? tTexto * 0.6 : 0);
        });

        this.malla.geometry.dispose();
        this.malla.geometry = new THREE.PlaneGeometry(d.ancho, d.alto);
        this.textura.needsUpdate = true;
      },
      remove: function () {
        this.el.removeObject3D('mesh');
        this.textura.dispose(); this.material.dispose();
      }
    });

    // mirar-al-centro: orienta la entidad para que su cara frontal mire al visitante (la cámara).
    AFRAME.registerComponent('mirar-al-centro', {
      init: function () { this.objetivo = new THREE.Vector3(0, 1.6, 0); },
      tick: function () {
        const camara = this.el.sceneEl.camera;
        if (camara) camara.getWorldPosition(this.objetivo);
        this.el.object3D.lookAt(this.objetivo);
      }
    });

    /* ============================================================
       Componente del recorrido
       ============================================================ */
    AFRAME.registerComponent('recorrido', {
      schema: {
        datos: { type: 'string', default: 'puntos.json' }
      },

      init: function () {
        this.hud = document.querySelector('#hud');
        this.panel = document.querySelector('#panel');
        this.cerrar = document.querySelector('#cerrar');
        this.visitados = new Set();
        this.total = 0;

        // Botón cerrar del panel (ya hecho)
        this.cerrar.addEventListener('click', () => {
          this.panel.setAttribute('visible', false);
          this.cerrar.classList.remove('clicable');
        });

        // TODO B1: cargar los puntos desde this.data.datos (puntos.json) con fetch().
        fetch(this.data.datos)
          .then(respuesta => {
            if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status);
            return respuesta.json();
          })
          .then(puntos => {
            this.total = puntos.length;
            puntos.forEach(p => this.crearPunto(p));
            this.actualizarHud();
          })
          .catch(error => {
            this.hud.setAttribute('texto-canvas', { titulo: 'Error', texto: error.message });
          });
      },

      // TODO B2: crear la entidad de un punto de interés
      crearPunto: function (p) {
        const punto = document.createElement('a-entity');
        punto.setAttribute('class', 'clicable');
        punto.setAttribute('position', p.posicion);
        punto.setAttribute('geometry', { primitive: 'circle', radius: 0.32 });
        punto.setAttribute('material', { color: '#B4441C', shader: 'flat' });
        punto.setAttribute('mirar-al-centro', '');
        punto.setAttribute('animation__latido', {
          property: 'scale',
          from: '1 1 1',
          to: '1.2 1.2 1.2',
          dir: 'alternate',
          loop: true,
          dur: 700
        });
        punto.addEventListener('click', () => {
          this.mostrarPanel(p, punto);
        });
        this.el.appendChild(punto);
      },

      mostrarPanel: function (p, punto) {
        // TODO C1: ubique this.panel al 40 % de la distancia del punto, haga que mire
        //   al visitante (0, 1.6, 0), cargue p.titulo y p.descripcion en texto-canvas,
        //   hágalo visible y agregue la clase "clicable" a this.cerrar.
        const pos = p.posicion;
        this.panel.object3D.position.set(pos.x * 0.4, 1.6 + (pos.y - 1.6) * 0.4, pos.z * 0.4);
        this.panel.object3D.lookAt(new THREE.Vector3(0, 1.6, 0));
        this.panel.setAttribute('texto-canvas', {
          titulo: p.titulo,
          texto: p.descripcion
        });
        this.panel.setAttribute('visible', true);
        this.cerrar.classList.add('clicable');

        // TODO C2: agregue p.id a this.visitados, pinte el punto de verde (#1E7A4C)
        //   y llame a this.actualizarHud().
        this.visitados.add(p.id);
        punto.setAttribute('material', { color: '#1E7A4C', shader: 'flat' });
        this.actualizarHud();
      },

      // Indicador de avance (ya hecho)
      actualizarHud: function () {
        const n = this.visitados.size;
        const texto = (this.total > 0 && n === this.total)
          ? '¡Recorrido completo! Puntos visitados: ' + n + ' de ' + this.total
          : 'Puntos visitados: ' + n + ' de ' + this.total;
        this.hud.setAttribute('texto-canvas', { titulo: '', texto: texto });
      }
    });
  </script>
</head>
<body>
  <a-scene>
    <a-assets>
      <img id="panorama" src="assets/panorama_calibracion.jpg" crossorigin="anonymous">
      <a-asset-item id="taza" src="assets/taza.glb"></a-asset-item>
    </a-assets>

    <!-- TODO A1: agregue aquí el cielo (a-sky) con la foto #panorama y rotation="0 -90 0" -->
    <a-sky src="#panorama" rotation="0 -90 0"></a-sky>

    <!-- Luces para el modelo 3D -->
    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 1.2" position="2 4 1"></a-entity>

    <!-- Cámara del visitante -->
    <a-entity id="camara" camera position="0 1.6 0"
              look-controls="magicWindowTrackingEnabled: true" wasd-controls="enabled: false">

      <!-- TODO A2: agregue aquí el cursor de mirada (fuse), como hijo de la cámara -->
      <a-entity cursor="fuse: true; fuseTimeout: 1500"
                raycaster="objects: .clicable; far: 20"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                material="color: #FFFFFF; shader: flat"
                animation__llenando="property: scale; startEvents: fusing; from: 1 1 1; to: 0.4 0.4 0.4; dur: 1500"
                animation__suelta="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 150">
      </a-entity>

      <!-- Indicador de avance (HUD): se mueve con la vista -->
      <a-entity id="hud" position="0 -0.38 -1"
                texto-canvas="texto: Cargando puntos...; ancho: 0.7; alto: 0.08; tamano: 66; alinear: center; fondo: #1B2A41">
      </a-entity>
    </a-entity>

    <!-- Panel de información (oculto hasta que se mira un punto) -->
    <a-entity id="panel" visible="false" texto-canvas="ancho: 2.2; alto: 1.2; tamano: 72">
      <a-entity id="cerrar" position="0.98 0.48 0.02"
                texto-canvas="titulo: X; ancho: 0.22; alto: 0.22; tamano: 560; alinear: center; fondo: #B4441C">
      </a-entity>
    </a-entity>

    <!-- Contenedor de los puntos: el componente recorrido los crea desde puntos.json -->
    <a-entity id="recorrido" recorrido="datos: puntos.json"></a-entity>

    <!-- TODO C3: agregue aquí el pedestal y el modelo 3D (#taza), con las animaciones
         de click (girar), mouseenter (agrandar) y mouseleave (volver al tamaño) -->
    <a-entity position="1.9 0 -1.1">
      <a-cylinder radius="0.35" height="0.9" position="0 0.45 0" color="#F2E8D5"></a-cylinder>
      <a-entity class="clicable"
                gltf-model="#taza"
                position="0 0.95 0"
                scale="0.3 0.3 0.3"
                animation__girar="property: rotation; from: 0 0 0; to: 0 360 0; dur: 1500; startEvents: click"
                animation__entrar="property: scale; startEvents: mouseenter; to: 0.36 0.36 0.36; dur: 200"
                animation__salir="property: scale; startEvents: mouseleave; to: 0.3 0.3 0.3; dur: 200">
      </a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
